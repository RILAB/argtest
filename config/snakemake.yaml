# Snakemake configuration for the ARG tree-sequence pipeline.
# Edit this file for your project, then run:
#   snakemake --cores N --configfile config/snakemake.yaml

# --------------------------------------------------------------------------- #
# Required paths
# --------------------------------------------------------------------------- #

# Root directory containing one subdirectory per chromosome, each holding one
# tree sequence file per replicate (e.g. chr1/rep_000.trees, chr1/rep_001.trees,
# ...). Paths are relative to the directory you run snakemake from (the repo
# root). The bundled realistic example has enough sites per chromosome that the
# 500-SNP mutload window below splits each chromosome into many windows.
root_dir: argtest-realistic-example

# HapMap-format recombination map used to identify low-recombination regions
# in step 1. Format: msprime.RateMap.read_hapmap compatible TSV.
hapmap: argtest-realistic-example/all.hapmap.tsv

# FASTA index (.fai) supplying chromosome lengths used in step 1.
fai: argtest-realistic-example/sim.fai

# --------------------------------------------------------------------------- #
# Tree file discovery
# --------------------------------------------------------------------------- #

# Glob pattern matched against filenames inside each chromosome subdirectory
# to find tree sequence files. Supported suffixes: .ts, .trees, .tsz.
tree_pattern: "*.trees"

# Optional subdirectory within each chromosome dir that holds the tree files
# (e.g. "trees" for SINGER-style layouts where chrom.N/trees/ holds the
# replicates). Leave unset when tree files live directly in the chromosome dir.
# tree_subdir: "trees"

# --------------------------------------------------------------------------- #
# Step 1: low-recombination masking
# --------------------------------------------------------------------------- #

# Fraction of recombination-rate intervals (ranked by Rate(cM/Mb), lowest
# first) to include in the low-recombination mask, per chromosome.
# E.g. 0.1 masks the bottom 10 % of intervals. Use 0.0 to write empty
# low-recombination masks. The realistic example has a low-rec centromere
# valley, so 0.05 surfaces a non-empty step-1 mask.
# NOTE: this is a fraction of the NUMBER OF INTERVALS between map markers,
# not of base pairs. Low-rec intervals tend to be long, so masking the
# bottom 5 % of intervals can remove well over 5 % of the genome by bp.
rec_fraction: 0.05

# --------------------------------------------------------------------------- #
# Step 2: low-accessibility masking
# --------------------------------------------------------------------------- #

# Window size in bp for accessibility calculation.
low_access_window_size: 50000

# Windows with fewer accessible bp than this value are flagged as
# low-accessibility and added to the mask.
low_access_cutoff_bp: 2500

# --------------------------------------------------------------------------- #
# Step 3: mutational-load outlier masking
# Set exactly ONE of mutload_window_size or mutload_snp_window.
# --------------------------------------------------------------------------- #

# Window size in bp for computing per-sample mutational load (fixed-bp mode).
# mutload_window_size: 50000

# Window size as a fixed number of variants (fixed-SNP mode). Uncomment to
# use instead of mutload_window_size.
mutload_snp_window: 500

# Fraction above/below the per-individual sim-based expected load that marks a
# sample as an outlier. E.g. 0.5 flags individuals whose observed load is
# > 1.5× or < 0.5× the expectation from a single msprime.sim_mutations draw on
# the input ARG.
mutload_cutoff: 0.5

# Single organism-wide scalar mutation rate (per bp per generation), shared as
# the fallback for BOTH the mutational-load sim (step 3) and the validation plots
# (step 6) whenever neither ts.metadata nor a sibling *.mut_rate.p file provides
# a ratemap. For ARGs from non-SINGER software (which usually carry no embedded
# ratemap and no .mut_rate.p), this scalar is the intended way to supply a rate.
# NOTE: for step 3 a flat scalar removes the local rate-variation correction the
# load test is designed around — prefer an embedded/sibling ratemap for step 3
# when one is available.
mutation_rate: 3e-8

# Base seed for the per-replicate sim used to compute expected load. The actual
# per-replicate seed is derived deterministically from this base plus the
# chrom/rep wildcards, so re-running step 3 produces identical outlier BEDs.
mutload_random_seed: 1

# If provided, windows where the outlier fraction exceeds this threshold are
# written to the mutation-masked BED (rather than the per-sample outlier BED)
# and are removed entirely in step 4.
mutload_fraction: 0.2

# Substring removed globally from sample names before matching individual IDs
# in steps 3 and 5. Set to "" if sample names need no normalization.
name_substring_to_remove: ""

# Step 5: extra user-supplied sample trimming, applied IN ADDITION to the step-3
# mutload outliers (e.g. introgressed individuals from TRACE, or any hand-curated
# list). Both keys apply identically to every (chrom, rep) and use the same
# sample-ID matching as step 3 (including name_substring_to_remove). Leave
# unset/empty to trim only the mutload outliers.
#   trim_individuals — IDs removed genome-wide. String "id1,id2" or YAML list.
#   trim_remove_bed  — BED file(s) of per-individual intervals; column 4 holds
#                      comma-separated sample IDs (or the filename stem if absent).
#                      Single path or a YAML list of paths.
# trim_individuals: ""
# trim_remove_bed: []

# Step 5b: minimum-sample interval filter. Intervals whose local trees carry
# fewer than this many samples are dropped before the merge. Must be an integer
# >= 0. Left commented out by default, which skips step 5b entirely (the merge
# reads step 5 directly). Uncomment to enable it; note that a value of 0 keeps
# every interval (nothing is below 0) but still runs the step as a pass-through,
# so use a value >= 1 to actually prune low-sample intervals.
# min_samples: 0

# --------------------------------------------------------------------------- #
# Concatenation behavior (merge step)
# --------------------------------------------------------------------------- #

# If true, allow merging when a replicate is absent in some chromosome
# directories (the missing chromosome is simply skipped). Set false to require
# all chromosomes to be present for every replicate.
allow_missing_replicates: false

# Number of leading discovered replicates to discard before concatenation
# ("burn-in"). For SINGER input the replicates are correlated posterior MCMC
# samples of the ARG, so dropping the first few discards the chain's warm-up;
# for independently-simulated inputs (like the bundled example) they are just
# independent draws and burn-in is optional. Applied after tree discovery and
# must be smaller than the number of discovered replicates. The bundled
# realistic example has 8 replicates, so burnin must be 0-7; use 0 here so the
# example runs as-is.
burnin: 0

# Prefix used for merged output filenames: <base_name>.combined.<replicate>.<suffix>.
base_name: "run"

# Suffix for merged output files. Uncomment and set to force a specific suffix
# (.ts, .trees, or .tsz); default is to inherit the suffix of the first input.
# merged_out_suffix: ".tsz"

# --------------------------------------------------------------------------- #
# Workflow outputs
# --------------------------------------------------------------------------- #

# Root directory for all Snakemake outputs. Tilde (~) is expanded; a relative
# path resolves against the directory you run snakemake from.
# NOTE: for cluster runs (--profile profiles/slurm) this MUST be on a shared
# filesystem visible to the compute nodes — a node-local path like /tmp will
# silently lose outputs (each job writes to its own node's /tmp). A relative
# path like the default below is shared as long as you run from shared storage.
out_dir: "argtest-realistic-example-out"

# --------------------------------------------------------------------------- #
# Step 6: validation plots
# --------------------------------------------------------------------------- #

# Master switch for step 6. When true (default) the validation plots run as long
# as a rate source is available — the shared `mutation_rate` above, or
# validation_sim_branch with an embedded/sibling ratemap. Set false to skip
# step 6 while keeping `mutation_rate` set for step 3.
run_validation: true

# If true, run validation plots only for the first chromosome (faster for
# quick QC checks). Set false to run for all chromosomes.
validation_first_chrom_only: true

# Window size in bp for step-6 diversity, Tajima's D, and segregating-sites
# validation plots. Larger windows run faster and use less memory on large ARGs
# but give coarser genome-wide QC curves.
validation_window_size: 100000

# If true, simulate mutations on each ARG replicate with msprime at the inferred
# mutation rate and compute site-mode statistics from those simulations
# (posterior predictive check). Uses an embedded ratemap or a co-located
# *.mut_rate.p file when available, otherwise falls back to the shared scalar
# `mutation_rate`. This can run without `mutation_rate` when every validated tree
# sequence has an embedded/sibling ratemap. If false, branch-mode statistics
# scaled by `mutation_rate` are used instead.
validation_sim_branch: true

# --------------------------------------------------------------------------- #
# Optional: VCF export from the filtered tree sequences
# --------------------------------------------------------------------------- #

# If true, emit one bgzip-less `.vcf.gz` per (chromosome, replicate) under
# <out_dir>/vcf/, built from the trimmed step-5 tree sequences (correct
# per-chromosome coordinates). Variable sites only (no invariant sites).
# Samples pruned from a tree by trim_samples appear as missing (.) at sites in
# those intervals. Haploid individuals are coded as a single allele (0/1);
# diploid as 0/1-style. The replicate set follows `burnin` above (leading
# replicates are already dropped). Disabled by default.
emit_vcf: false

# Restrict VCF output to specific replicate IDs (a subset of the post-burnin
# replicates). Leave unset/null to emit every post-burnin replicate.
# vcf_reps: ["4", "7"]

# --------------------------------------------------------------------------- #
# Cluster / SLURM execution
# Used ONLY when you add `--profile profiles/slurm` to the snakemake command.
# All cluster knobs live here; the profile file itself is set-and-forget.
# A plain `snakemake --cores N` run ignores everything below.
# --------------------------------------------------------------------------- #

# SLURM account to charge jobs to.
slurm_account: jrigrp

# Default partition for the light per-(chrom,rep) rules.
slurm_partition: low

# Per-rule resource overrides. Any rule not listed uses the defaults:
#   mem_mb: 4000, time: "01:00:00", threads: 1, partition: <slurm_partition>.
# mem_mb is in MB; time is HH:MM:SS; `partition` overrides slurm_partition for
# that rule (e.g. send the memory-heavy steps to a big-mem partition).
resources:
  step2_low_access:          {mem_mb: 8000,   time: "04:00:00"}
  step3_mutload_masks:       {mem_mb: 12000,  time: "08:00:00"}
  step4_trim_regions_single: {mem_mb: 8000,   time: "04:00:00"}
  step5_trim_samples_single: {mem_mb: 8000,   time: "04:00:00"}
  merge_replicates:          {mem_mb: 200000, time: "16:00:00", partition: high}
  step6_validation_plots:    {mem_mb: 180000, time: "48:00:00", partition: high}
  # step6b only reads the step-6 windows.tsv dumps, so it is light regardless of
  # genome size; the default 01:00:00 is ample.
  step6b_genomewide_scatter: {mem_mb: 8000,   time: "01:00:00"}
  # step7 reads every final filtered ARG once (~3 s each for a 20 MB .tsz), so its
  # wall time scales with n_chroms x n_replicates. 1200 ARGs runs over an hour,
  # which the 01:00:00 profile default silently turns into a SLURM TIMEOUT.
  step7_summary:             {mem_mb: 8000,   time: "12:00:00"}
