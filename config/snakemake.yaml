# Required
root_dir: /home/jri/src/argtest/example_data/sim_2chr_5rep_clean/trees
hapmap: /home/jri/src/argtest/example_data/sim_2chr_5rep_clean/hapmap/all.hapmap.tsv
fai: /home/jri/src/argtest/example_data/sim_2chr_5rep_clean/sim.fai

# Tree discovery
tree_pattern: "*.trees"

# Step 1
rec_fraction: 0.1

# Step 2
low_access_window_size: 50000
low_access_cutoff_bp: 2500

# Step 3 (set exactly one of mutload_window_size or mutload_snp_window)
mutload_window_size: 50000
# mutload_snp_window: 500
mutload_cutoff: 0.25
mutload_fraction: 0.2
suffix_to_strip: "_anchorwave"

# Concatenation behavior
allow_missing_replicates: false
burnin: 0
base_name: "run"
# merged_out_suffix: ".tsz"

# Workflow outputs
out_dir: "/tmp/argtest-snakemake-example-out"

# Step 6 - Validation plots (omit or set to null to skip)
validation_mutation_rate: 1e-8
validation_first_chrom_only: true
validation_sim_branch: true  # set true to use msprime posterior-predictive (sim) stats instead of branch-mode
