# Snakemake configuration for the ARG tree-sequence pipeline.
# Edit this file for your project, then run:
#   snakemake --cores N --configfile config/snakemake.yaml

# --------------------------------------------------------------------------- #
# Required paths
# --------------------------------------------------------------------------- #

# Root directory containing one subdirectory per chromosome, each holding one
# tree sequence file per replicate (e.g. chr1/1.trees, chr1/2.trees, ...).
root_dir: /home/jri/src/argtest/eur_thaliana

# HapMap-format recombination map used to identify low-recombination regions
# in step 1. Format: msprime.RateMap.read_hapmap compatible TSV.
hapmap: /home/jri/src/argtest/eur_thaliana/thaliana.hapmap

# FASTA index (.fai) supplying chromosome lengths used in step 1.
fai: /home/jri/src/argtest/eur_thaliana/reference_sites.fa.fai

# --------------------------------------------------------------------------- #
# Tree file discovery
# --------------------------------------------------------------------------- #

# Glob pattern matched against filenames inside each chromosome subdirectory
# to find tree sequence files. Supported suffixes: .ts, .trees, .tsz.
tree_pattern: "*.tsz"

# Subdirectory within each chromosome dir that holds the tree files. The
# eur_thaliana data is SINGER output, so the .tsz replicates live in
# combined.ChrN/trees/ (e.g. combined.Chr1/trees/combined.Chr1.0.tsz).
tree_subdir: "trees"

# --------------------------------------------------------------------------- #
# Step 1: low-recombination masking
# --------------------------------------------------------------------------- #

# Fraction of recombination-rate intervals (ranked by Rate(cM/Mb), lowest
# first) to include in the low-recombination mask, per chromosome.
# E.g. 0.1 masks the bottom 10 % of intervals. Use 0.0 to write empty
# low-recombination masks, which keeps the bundled example data unchanged.
rec_fraction: 0.0

# --------------------------------------------------------------------------- #
# Step 2: low-accessibility masking
# --------------------------------------------------------------------------- #

# Window size in bp for accessibility calculation.
low_access_window_size: 50000

# Windows with fewer accessible bp than this value are flagged as
# low-accessibility and added to the mask.
low_access_cutoff_bp: 2500

# --------------------------------------------------------------------------- #
# Step 3: mutational-load outlier masking
# Set exactly ONE of mutload_window_size or mutload_snp_window.
# --------------------------------------------------------------------------- #

# Window size in bp for computing per-sample mutational load (fixed-bp mode).
# mutload_window_size: 50000

# Window size as a fixed number of variants (fixed-SNP mode). Uncomment to
# use instead of mutload_window_size.
mutload_snp_window: 500

# Fraction above/below the per-individual sim-based expected load that marks a
# sample as an outlier. E.g. 0.5 flags individuals whose observed load is
# > 1.5× or < 0.5× the expectation from a single msprime.sim_mutations draw on
# the input ARG.
mutload_cutoff: 0.5

# Organism-wide scalar mutation rate (per bp per generation), used as the shared
# fallback for BOTH the mutational-load sim (step 3) and the validation plots
# (step 6) whenever neither ts.metadata nor a sibling *.mut_rate.p file provides
# a ratemap. Set this once instead of the two per-step keys. For ARGs from
# non-SINGER software (which usually carry no embedded ratemap and no .mut_rate.p),
# this scalar is the intended way to supply a rate.
# mutation_rate: 1e-8

# Per-step override of `mutation_rate` for the step-3 mutational-load sim only.
# Leave unset to inherit `mutation_rate`. NOTE: a flat scalar removes the local
# rate-variation correction the load test is designed around — prefer an
# embedded/sibling ratemap for step 3 when one is available.
# mutload_mutation_rate: 1e-8

# Base seed for the per-replicate sim used to compute expected load. The actual
# per-replicate seed is derived deterministically from this base plus the
# chrom/rep wildcards, so re-running step 3 produces identical outlier BEDs.
mutload_random_seed: 8675309

# If provided, windows where the outlier fraction exceeds this threshold are
# written to the mutation-masked BED (rather than the per-sample outlier BED)
# and are removed entirely in step 4.
mutload_fraction: 0.2

# Suffix stripped from sample names before matching individual IDs in steps 3
# and 5. Set to "" if sample names need no stripping.
suffix_to_strip: "_anchorwave"

# --------------------------------------------------------------------------- #
# Concatenation behavior (step 6 merging)
# --------------------------------------------------------------------------- #

# If true, allow merging when a replicate is absent in some chromosome
# directories (the missing chromosome is simply skipped). Set false to require
# all chromosomes to be present for every replicate.
allow_missing_replicates: false

# Number of leading discovered replicates to discard before concatenation.
# WARNING: burnin is applied after tree discovery and must be smaller than the
# number of discovered replicates/samples. The eur_thaliana data has 50
# replicates per chromosome, so discard the first half (the SINGER MCMC warm-up).
burnin: 25

# Prefix used for merged output filenames: <base_name>.combined.<replicate>.<suffix>.
base_name: "eur_thaliana"

# Suffix for merged output files. Uncomment and set to force a specific suffix
# (.ts, .trees, or .tsz); default is to inherit the suffix of the first input.
# merged_out_suffix: ".tsz"

# --------------------------------------------------------------------------- #
# Workflow outputs
# --------------------------------------------------------------------------- #

# Root directory for all Snakemake outputs. Tilde (~) is expanded.
out_dir: "~/src/argtest/thaliana_tested/"

# --------------------------------------------------------------------------- #
# Step 6: validation plots (omit validation_mutation_rate or set to null to skip)
# --------------------------------------------------------------------------- #

# Mutation rate (per bp per generation) used to scale branch-mode diversity for
# comparison to site-mode diversity in validation plots, and as the scalar
# fallback for validation_sim_branch below. Defaults to the shared `mutation_rate`
# if unset; set here only to override it for step 6. Set to null to skip step 6.
validation_mutation_rate: 1e-8 #  mutation rate used in SINGER simulations

# If true, run validation plots only for the first chromosome (faster for
# quick QC checks). Set false to run for all chromosomes.
validation_first_chrom_only: false

# If true, simulate mutations on each posterior ARG replicate with msprime at the
# inferred mutation rate and compute site-mode statistics from those simulations
# (posterior predictive check). Uses an embedded ratemap or a co-located
# *.mut_rate.p file when available, otherwise falls back to the uniform
# validation_mutation_rate. If false, branch-mode statistics scaled by
# validation_mutation_rate are used instead.
validation_sim_branch: true

# --------------------------------------------------------------------------- #
# Cluster / SLURM execution
# Used ONLY when you add `--profile profiles/slurm` to the snakemake command.
# All cluster knobs live here; the profile file itself is set-and-forget.
# A plain `snakemake --cores N` run ignores everything below.
# --------------------------------------------------------------------------- #

# SLURM account to charge jobs to.
slurm_account: jrigrp

# Default partition for the light per-(chrom,rep) rules.
slurm_partition: low

# Per-rule resource overrides. Any rule not listed uses the defaults:
#   mem_mb: 4000, time: "01:00:00", threads: 1, partition: <slurm_partition>.
# mem_mb is in MB; time is HH:MM:SS; `partition` overrides slurm_partition for
# that rule (e.g. send the memory-heavy steps to a big-mem partition).
resources:
  step2_low_access:          {mem_mb: 8000,   time: "24:00:00"}
  step3_mutload_masks:       {mem_mb: 12000,  time: "24:00:00"}
  step4_trim_regions_single: {mem_mb: 8000,   time: "24:00:00"}
  step5_trim_samples_single: {mem_mb: 16000,  time: "48:00:00"}
  merge_replicates:          {mem_mb: 64000,  time: "128:00:00"}
  step6_validation_plots:    {mem_mb: 64000,  time: "128:00:00"}
